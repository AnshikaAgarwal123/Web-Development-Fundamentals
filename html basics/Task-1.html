<!-- 
  ========================================================================
  TASK 1: Online Course Advertisement Web Page
  ========================================================================
  Objective:
  Create a basic HTML webpage advertising an online course that 
  demonstrates the use of fundamental HTML tags, including:
  
  - Heading tags (h1, h2) with inline styling to center align text.
  - Text formatting tags (i, b, u, strike, big, small).
  - HTML entities (&nbsp;) for custom spacing.
  - Subscript (sub) and Superscript (sup) tags for chemical formulas 
    and mathematical expressions.
  ========================================================================
-->
  <!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task-1</title>
    </head>
    <body>
    <h1 style="text-align:center">Online Course Advertisement</h1>
    <h2> Python Course</h2>
    <p><big>Instructor name: <i>Anshika Agarwal</i></big></p>
    <p><big>Price:<strike>Rs.5000  </strike><b>&nbsp;&nbsp;Rs.3000</b></big></p>
    <p><small><u>Limited Seats Available</u></small></p>
    <br>
    <p><big><b>Some Chemistry Concepts:-</big></b></p>
    <p><big>H<sub>2</sub>O= Water</big></p>
    <p><big>CO<sub>2</sub>= Carbon Dioxide</big></p>
    <br>
    <p><big><b>Some Mathematical Formula:-</b></big></p>
    <p><big>(x+y)<sup>2</sup>= x<sup>2</sup>+y<sup>2</sup>+2xy </big></p>
    </body>
</html>
